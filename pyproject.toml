[project]
name = "docintel"
version = "0.1.0"
description = "Evidence-grounded invoice and credit-note intelligence"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "pydantic>=2.10,<3", "pypdf>=5,<7", "pypdfium2>=4.30,<6", "Pillow>=11,<13", "pytesseract>=0.3.13,<1", "reportlab>=4.2,<5"]
[project.optional-dependencies]
vision = ["torch>=2.5,<3", "transformers>=4.49,<5", "accelerate>=1,<2"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
[project.scripts]
docintel = "docintel.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
